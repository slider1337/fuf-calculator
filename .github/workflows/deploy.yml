name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/write-env.py"
          target: /opt/fuf-calculator
          strip_components: 1

      - name: Deploy to production VM
        uses: appleboy/ssh-action@v1
        env:
          APP_URL: ${{ vars.APP_URL }}
          MAILER_DSN: ${{ secrets.MAILER_DSN }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          EASYVEREIN_CLIENT_ID: ${{ vars.EASYVEREIN_CLIENT_ID }}
          EASYVEREIN_CLIENT_SECRET: ${{ secrets.EASYVEREIN_CLIENT_SECRET }}
          EASYVEREIN_API_TOKEN: ${{ secrets.EASYVEREIN_API_TOKEN }}
          EASYVEREIN_WRITE_MODE: ${{ vars.EASYVEREIN_WRITE_MODE }}
          EASYVEREIN_REQUESTS_PER_MINUTE: ${{ vars.EASYVEREIN_REQUESTS_PER_MINUTE }}
          MAIL_DELIVERY_MODE: ${{ vars.MAIL_DELIVERY_MODE }}
          FUF_INTEGRATION_AUDIENCE: ${{ vars.FUF_INTEGRATION_AUDIENCE }}
          FUF_INTEGRATION_SERVICES: ${{ secrets.FUF_INTEGRATION_SERVICES }}
          FUF_WORKER_BATCH: ${{ vars.FUF_WORKER_BATCH }}
          FUF_WORKER_INTERVAL: ${{ vars.FUF_WORKER_INTERVAL }}
          FUF_RECONCILE_ACTOR_ID: ${{ vars.FUF_RECONCILE_ACTOR_ID }}
          FUF_RECONCILE_INTERVAL: ${{ vars.FUF_RECONCILE_INTERVAL }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_URL,MAILER_DSN,MAIL_FROM,EASYVEREIN_CLIENT_ID,EASYVEREIN_CLIENT_SECRET,EASYVEREIN_API_TOKEN,EASYVEREIN_WRITE_MODE,EASYVEREIN_REQUESTS_PER_MINUTE,MAIL_DELIVERY_MODE,FUF_INTEGRATION_AUDIENCE,FUF_INTEGRATION_SERVICES,FUF_WORKER_BATCH,FUF_WORKER_INTERVAL,FUF_RECONCILE_ACTOR_ID,FUF_RECONCILE_INTERVAL
          script: |
            set -e
            cd /opt/fuf-calculator

            # Write .env file for docker compose
            umask 077
            python3 write-env.py

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop all writers and create a consistent backup before migration.
            docker compose -f docker-compose.prod.yml stop app worker
            docker compose -f docker-compose.prod.yml run --rm --no-deps app php scripts/backup.php

            # Run database migrations using the new image (one-shot, shares the DB volume)
            docker compose -f docker-compose.prod.yml run --rm --no-deps app php scripts/migrate.php

            # Restart with new image
            docker compose -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -f

            echo "Deployment complete!"
