name: Diagnose affected cancellation codes
on:
  push:
    branches: [diagnose/booking-guest-20261018]
    paths: [.github/workflows/diagnose-booking-guest.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/fuf-calculator
            docker compose -f docker-compose.prod.yml exec -T app php <<'PHP'
            <?php
            require '/app/vendor/autoload.php';
            $c=App\Infrastructure\ContainerServices::create();
            $db=App\Infrastructure\ContainerServices::get($c,PDO::class);
            $jobs=$db->query("SELECT id,kind,status,error_code,initial_error_code,validation_errors_json,attempts,payload_json FROM participation_jobs WHERE trip_id=3 AND registration_id=19 AND kind='cancel' ORDER BY id")->fetchAll(PDO::FETCH_ASSOC);
            foreach($jobs as $j){$p=json_decode($j['payload_json'],true);unset($j['payload_json']);$j['hasGuestId']=isset($p['guestId']);$j['validation_errors_json']=json_decode($j['validation_errors_json'],true);echo json_encode($j).PHP_EOL;}
            if(!$jobs)exit("no_cancel_jobs\n");
            try{
             $full=$db->query("SELECT payload_json FROM participation_jobs WHERE id=".(int)$jobs[0]['id'])->fetchColumn();$p=json_decode($full,true);
             $a=App\Infrastructure\ContainerServices::get($c,App\Application\Port\ParticipationPort::class);$s=$a->snapshot($p['eventId']);
             foreach($jobs as $j){$q=$db->query('SELECT payload_json FROM participation_jobs WHERE id='.(int)$j['id'])->fetchColumn();$p=json_decode($q,true);$found=array_values(array_filter($s['participants'],fn($r)=>$r['externalId']===($p['externalId']??null)));echo json_encode(['stage'=>'external','job'=>$j['id'],'matches'=>count($found),'status'=>$found[0]['status']??null,'isGuest'=>$found[0]['isCompanion']??null]).PHP_EOL;}
            }catch(Throwable $e){echo json_encode(['error'=>$e instanceof App\Application\AccessException?$e->error:get_class($e),'location'=>basename($e->getFile()).':'.$e->getLine()]).PHP_EOL;exit(1);}
            PHP
