name: Inspect easyVerein rate limit response headers
on:
  push:
    branches: [diagnose/link-timestamp-20261018]
    paths: [.github/workflows/link-timestamp-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Two read-only API calls, header names and rate budget only
        env:
          EV_TOKEN: ${{ secrets.EASYVEREIN_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          for i in range(2):
              req=urllib.request.Request('https://easyverein.com/api/v3.0/calendar/?limit=1&query=%7Bid%7D',headers={'Authorization':'Bearer '+os.environ['EV_TOKEN'],'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      print(json.dumps({'call':i+1,'status':r.status,'header_names':list(r.headers.keys()),'budget_headers':{k:v for k,v in r.headers.items() if any(t in k.lower() for t in ['ratelimit','rate-limit','remaining','retry-after','reset'])}}))
              except urllib.error.HTTPError as e:
                  print(json.dumps({'call':i+1,'status':e.code,'budget_headers':{k:v for k,v in e.headers.items() if any(t in k.lower() for t in ['ratelimit','rate-limit','remaining','retry-after','reset'])}}))
          PY
