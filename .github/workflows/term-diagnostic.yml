name: Targeted term diagnostic
on:
  push:
    branches: [diagnose/term-creation-20261017]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Explicit user authorization: affected job and selected event fields only.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/fuf-calculator
            worker_id=$(docker compose -f docker-compose.prod.yml ps -q worker)
            docker inspect --format '{{json .Config.Healthcheck.Test}}' "$worker_id"
            docker compose -f docker-compose.prod.yml exec -T app php <<'PHP'
            <?php
            require "/app/vendor/autoload.php";
            $db=new PDO("sqlite:/app/database/fuf.sqlite");
            $db->exec("PRAGMA query_only=ON");
            $id=$db->query("SELECT external_id FROM external_event_links WHERE trip_id=2")->fetchColumn();
            if(!is_string($id)||!preg_match("/^[1-9][0-9]*$/D",$id)){echo "event not linked\n";exit;}
            try{
              $c=App\Infrastructure\ContainerServices::create();
              $client=App\Infrastructure\ContainerServices::get($c,App\Application\Port\EasyVereinReadClient::class);
              $event=$client->get("event/".$id."/",["query"=>"{id,start,end,end_participation,access,canceled}"]);
              echo "provider ",json_encode(array_intersect_key($event,array_flip(["id","start","end","end_participation","access","canceled"]))),PHP_EOL;
            }catch(App\Application\AccessException $e){echo "provider_error ",$e->error,PHP_EOL;}
            catch(Throwable $e){echo "diagnostic_error ",get_class($e),PHP_EOL;}
            PHP
