.wstep.on{color:#2E2217}.wstep.on i{background:#4A2E1A;border-color:#4A2E1A;color:#FBF5EA}.wstep.done{color:#3F7F3A}.wstep.done i{border-color:#3F7F3A}

<div class="w" style="padding:40px;min-height:1200px"><h1 class="zs" style="margin:0 0 6px;font-size:36px">Website-Formular · Zustände</h1><p class="muted" style="margin:0 0 28px">Mitgliederseite im Stil „Holz &amp; Lagerfeuer“. Formulardefinition kommt aus dem Calculator.</p>

<div style="display:flex;flex-direction:column;gap:10px"><b class="zs" style="font-size:18px">Pflichtfehler</b><div class="wcard" style="padding:18px;display:flex;flex-direction:column;gap:12px"><div class="werr" role="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"></path></svg><span>2 Angaben fehlen – bitte unten ergänzen.</span></div><button type="button" class="wchk bad"><span class="box26"></span><span>Ich übernehme für alle angemeldeten Kinder die Aufsichtspflicht. *</span></button><span style="color:#B3261E;font-weight:700;font-size:14px">Diese Bestätigung ist nötig, weil Kinder angemeldet sind.</span><div class="wq"><b>Skikurs gewünscht? · Paul *</b><div style="display:flex;gap:8px"><button type="button" class="pill bad">Ja</button><button type="button" class="pill bad">Nein</button></div><span style="color:#B3261E;font-weight:700;font-size:14px">Bitte Ja oder Nein wählen.</span></div></div></div>

<div style="display:flex;flex-direction:column;gap:10px"><b class="zs" style="font-size:18px">Teilfehler nach dem Absenden</b><div class="wcard" style="padding:18px;display:flex;flex-direction:column;gap:12px"><span class="zs" style="font-size:22px">Fast geschafft</span><span>Anmeldung gespeichert (B-2027-0013).</span><div class="sumrow"><span>Maria, Stefan, Paul</span><b style="color:#3F7F3A">bestätigt</b></div><div class="sumrow"><span>Lena</span><b style="color:#B4501A">wird noch geprüft</b></div><div style="background:#F9E1C8;border-radius:12px;padding:12px 14px;font-size:14px">Bitte nicht erneut abschicken – es entsteht keine doppelte Anmeldung.</div></div></div>

<script>
(function(){
class DCLogic{constructor(p){this.props=p||{};this.state={};}setState(o){this.state=Object.assign({},this.state,typeof o==='function'?o(this.state):o);window.__dcRender();}forceUpdate(){window.__dcRender();}}
window.DCLogic=DCLogic;
const TPL=document.getElementById('dc-tpl');
function look(path,scopes){path=path.trim();if(path==='true')return true;if(path==='false')return false;if(/^-?\d+(\.\d+)?$/.test(path))return +path;
 const parts=path.split('.');for(let i=scopes.length-1;i>=0;i--){if(scopes[i]&&parts[0] in scopes[i]){let v=scopes[i];for(const p of parts){v=v==null?undefined:v[p];}return v;}}return undefined;}
const WHOLE=/^\{\{\s*([^}]+?)\s*\}\}$/;
function interp(s,sc){return s.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(m,p)=>{const v=look(p,sc);return v==null?'':String(v);});}
function render(node,sc,parent){
 if(node.nodeType===3){parent.appendChild(document.createTextNode(interp(node.nodeValue,sc)));return;}
 if(node.nodeType!==1)return;
 const tag=node.tagName.toLowerCase();
 if(tag==='sc-if'){const m=WHOLE.exec(node.getAttribute('value')||'');if(m&&look(m[1],sc)){for(const c of node.childNodes)render(c,sc,parent);}return;}
 if(tag==='sc-for'){const m=WHOLE.exec(node.getAttribute('list')||'');const list=m?look(m[1],sc)||[]:[];const as=node.getAttribute('as')||'item';
   list.forEach((it,i)=>{const s={$index:i};s[as]=it;for(const c of node.childNodes)render(c,sc.concat([s]),parent);});return;}
 const ns=node.namespaceURI;const el=ns&&ns!=='http://www.w3.org/1999/xhtml'?document.createElementNS(ns,tag):document.createElement(tag);
 for(const a of Array.from(node.attributes)){const n=a.name,v=a.value;const m=WHOLE.exec(v);
   if(/^on[a-z]+$/i.test(n)&&m){const fn=look(m[1],sc);if(typeof fn==='function'){let ev=n.slice(2).toLowerCase();if(ev==='change'&&(tag==='input'||tag==='textarea'))ev='change';el.addEventListener(ev,fn);}continue;}
   if(n.startsWith('hint-'))continue;
   if(m){const val=look(m[1],sc);if(n==='value'){el.value=val==null?'':val;el.setAttribute('value',val==null?'':val);}else if(typeof val==='boolean'&&!n.startsWith('aria-')){if(val)el.setAttribute(n,'');}else el.setAttribute(n,val==null?'':String(val));}
   else el.setAttribute(n,v.indexOf('{{')>=0?interp(v,sc):v);}
 if(tag==='template'){parent.appendChild(el);return;}
 for(const c of node.childNodes)render(c,sc,el);parent.appendChild(el);}
let comp=null;
window.__dcRender=function(){const root=document.getElementById('dc-root');const vals=comp.renderVals();const sx=window.scrollX,sy=window.scrollY;root.innerHTML='';for(const c of TPL.content.childNodes)render(c,[vals],root);window.scrollTo(sx,sy);};
window.__dcStart=function(C){comp=new C({});window.__dcRender();};
})();
</script>
<script>

class Component extends DCLogic {
  renderVals() { return {}; }
}

window.__dcStart(Component);
</script>
