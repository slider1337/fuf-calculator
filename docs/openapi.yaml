  /api/trips/{id}/term/updates/save:
    post:
      summary: Termin direkt in easyVerein speichern und das Übertragungsergebnis zurückgeben
      description: Benötigt term.manage. Kein Grund und keine manuelle Vorschau nötig. Beginn und Ende werden
        serverseitig aus der gespeicherten Reise in Europe/Berlin übernommen. observedHash bindet den angezeigten
        externen Stand und die Reisedaten. Der konkrete Auftrag wird dauerhaft gespeichert und sofort ausgeführt.
        Wiederholung mit gleichem operationKey liefert denselben Auftrag, auch bei unklarem Ausgang kein zweiter PATCH.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, observedHash, operationKey]
              properties:
                changes:
                  type: object
                  description: Nur geänderte Felder. Anmeldeschluss auch als datetime-local in Europe/Berlin.
                  additionalProperties: true
                observedHash:
                  type: string
                operationKey:
                  type: string
      responses:
        '200':
          description: Direkter Status einschließlich sicherer Fehlerdetails; succeeded bestätigt den Provider-Readback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermSaveResult'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Terminrechte fehlen
        '404':
          description: Reise nicht zugänglich
        '409':
          description: Reise gesperrt, Stand geändert, Anmeldefrist überlappt oder vorherige Übertragung noch offen
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: easyVerein nicht erreichbar oder Termindaten unvollständig
  /api/trips/{id}/term/updates/resolve:
    post:
      summary: Unklaren Änderungsauftrag nach Prüfung des aktuellen easyVerein-Stands lokal abschließen
      description: Benötigt term.manage, offene und nicht archivierte easyVerein-Reise, Bestätigung.
        Liest den Provider frisch und prüft observedHash. Nur unknown ohne Worker-Lease ist abschließbar.
        Kein erneuter PATCH. Der ursprüngliche Ausgang wird nicht nachträglich als sicher fehlgeschlagen bezeichnet.
      parameters:
