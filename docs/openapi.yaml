components:
  securitySchemes:
    calculatorSession:
      type: apiKey
      in: cookie
      name: fufsid
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: validation_error
              details:
                type: object
                additionalProperties:
                  type: string
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: not_found
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: unauthorized
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorBody'
    AuthError:
      description: Authentication or authorization error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorBody'

  schemas:
    EventInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        archived:
          type: boolean
        revision:
          type: integer
          minimum: 1
      required:
      - name
    EventListItem:
      allOf:
      - $ref: '#/components/schemas/EventInput'
      - type: object
        properties:
          id:
            type: integer
            minimum: 1
          tripCount:
            type: integer
          nextTripDate:
            type: string
            format: date
            nullable: true
          capabilities:
            type: array
            items:
              type: string
        required:
        - id
        - tripCount
        - nextTripDate
        - capabilities
    EventDetail:
      allOf:
      - $ref: '#/components/schemas/EventInput'
      - type: object
        properties:
          id:
            type: integer
            minimum: 1
          trips:
            type: array
            items:
              $ref: '#/components/schemas/TripListItem'
          capabilities:
            type: array
            items:
              type: string
        required:
        - id
        - trips
        - capabilities
    TeamMember:
      type: object
      properties:
        userId:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        capabilities:
          type: array
          items:
            type: string
      required:
      - userId
      - email
      - capabilities
    GrantInput:
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
            enum:
            - trip.view
            - trip.manage
            - registration.view
            - registration.manage
            - answers.view
            - answers.correct
            - answers.export
            - analytics.view
            - calculation.manage
            - settlement.view
            - settlement.close
            - settlement.reopen
            - expense.view
            - expense.manage
            - term.manage
            - access.manage
            - event.view
            - event.manage
            - form.manage
            - form.publish
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - capabilities
      - reason
    ReasonInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    EventAssignment:
      type: object
      properties:
        eventId:
          type: integer
          nullable: true
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - eventId
      - reason
    DuplicateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
      required:
      - name
      - startDate
    LegacyCandidate:
      type: object
      properties:
        tripId:
          type: integer
          minimum: 1
        tripName:
          type: string
        userId:
          type: integer
          minimum: 1
        email:
          type: string
      required:
      - tripId
      - tripName
      - userId
      - email
    LegacyAccessInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        pairs:
          type: array
          items:
            type: object
            properties:
              tripId:
                type: integer
                minimum: 1
              userId:
                type: integer
                minimum: 1
              capabilities:
                type: array
                items:
                  type: string
            required:
            - tripId
            - userId
      required:
      - reason
      - pairs
    TeamPerson:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: string
      required:
      - id
      - email
    ActionResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    TripSummary:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        eventId:
          type: integer
          nullable: true
        closedAt:
          type: string
          nullable: true
        closedBy:
          type: integer
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        calculationSnapshot:
          allOf:
          - $ref: '#/components/schemas/CalculationResult'
          nullable: true
      required:
      - id
      - name
      - startDate
      - endDate
      - eventId
      - closedAt
      - closedBy
      - capabilities
      - calculationSnapshot
    Settings:
      type: object
      required:
        - defaultMarkupPercent
        - defaultClubFeePercent
        - defaultDistributionMethod
        - defaultSpaTaxPerPerson
        - defaultSpaTaxAgeThreshold
        - defaultAdultAgeThreshold
      properties:
        defaultMarkupPercent:
          type: number
          format: float
          example: 10.0
        defaultClubFeePercent:
          type: number
          format: float
          example: 5.0
        defaultDistributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        defaultSpaTaxPerPerson:
          type: number
          format: float
          example: 2.5
        defaultSpaTaxAgeThreshold:
          type: integer
          example: 18
        defaultAdultAgeThreshold:
          type: integer
          example: 16

    RoomBooking:
      type: object
      required: [categoryType, count, basePricePerPerson]
      properties:
        categoryType:
          type: string
          enum: [ADULT_DOUBLE, ADULT_MULTI, CHILD]
        count:
          type: integer
        basePricePerPerson:
          type: number
          format: float

    GroupExpense:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
        amount:
          type: number
          format: float

    RoomReservation:
      type: object
      required: [roomType, count]
      properties:
        roomType:
          type: string
          example: 2-Bettzimmer
          description: >-
            Freier Text. Er wird den Zimmerkategorien der Anmeldungen zugeordnet, ohne
            Gross-/Kleinschreibung und Leerzeichen am Rand zu beachten.
        count:
          type: integer
          minimum: 0
          description: Anzahl reservierter Zimmer (nicht Personen).

    CreateTripRequest:
      type: object
      required:
        - name
        - startDate
        - markupPercent
        - clubFeePercent
        - distributionMethod
        - spaTaxPerPerson
        - spaTaxAgeThreshold
        - adultAgeThreshold
        - bookings
        - groupExpenses
      properties:
        eventId:
          type: integer
          nullable: true
          minimum: 1
          description: Optionale Veranstaltung für neue Durchführungen. Ohne Angabe oder mit null wird eine unabhängige Reise angelegt; andernfalls ist eine positive ganzzahlige ID mit event.manage erforderlich.
        name:
          type: string
        startDate:
          type: string
          format: date
        markupPercent:
          type: number
          format: float
        clubFeePercent:
          type: number
          format: float
        distributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        spaTaxPerPerson:
          type: number
          format: float
        spaTaxAgeThreshold:
          type: integer
        adultAgeThreshold:
          type: integer
          example: 16
        averageAdultPrice:
          type: boolean
          default: false
          description: >-
            Ist die Option gesetzt, zahlen Erwachsene im Doppel- und im Mehrbettzimmer
            denselben Preis: den nach Personenzahl gewichteten Durchschnitt der
            Naechtigungspreise. Die ausgewiesenen Unterkunftskosten bleiben davon
            unberuehrt.
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/RoomBooking'
        groupExpenses:
          type: array
          items:
            $ref: '#/components/schemas/GroupExpense'
        roomReservations:
          type: array
          default: []
          description: >-
            Beim Haus reservierte Zimmer je Typ. Jeder Typ darf nur einmal vorkommen
            (sonst 422 mit duplicate_room_type). Eintraege ohne Typ und mit Anzahl 0
            werden uebergangen; ohne Typ, aber mit Anzahl, liefern sie 422 mit
            room_type_required. Beim Aktualisieren ersetzt die Liste die bisherige.
          items:
            $ref: '#/components/schemas/RoomReservation'

    Trip:
      allOf:
      - $ref: '#/components/schemas/CreateTripRequest'
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
      - $ref: '#/components/schemas/TripSummary'

    TripListItem:
      type: object
      required:
      - id
      - name
      - startDate
      - endDate
      - nights
      - plannedParticipants
      - registeredParticipants
      - surplus
      - surplusBasis
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        nights:
          type: integer
        plannedParticipants:
          type: integer
          description: Summe der geplanten Teilnehmer ueber alle Zimmerbuchungen.
          nullable: true
        registeredParticipants:
          type: integer
          description: Summe der Teilnehmer ueber alle Anmeldungen.
          nullable: true
        surplus:
          type: number
          format: float
          nullable: true
          description: Ueberschuss bzw. Defizit. null, wenn er fuer die Reise nicht bestimmbar
            ist.
        surplusBasis:
          type: string
          nullable: true
          enum:
          - calculation
          - settlement
          description: Grundlage des Ueberschusses. "settlement", sobald Anmeldungen vorliegen,
            sonst "calculation". null, wenn surplus null ist.
        eventId:
          type: integer
          nullable: true
        closedAt:
          type: string
          nullable: true

    CalculationResult:
      type: object
      properties:
        pricesPerCategory:
          type: object
          additionalProperties:
            type: number
            format: float
        priceBreakdowns:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PriceBreakdown'
        totalGroupExpenses:
          type: number
          format: float
        totalParticipants:
          type: integer
        totalCalculatedRevenue:
          type: number
          format: float
        totalCalculatedCosts:
          type: number
          format: float
        surplus:
          type: number
          format: float
        distributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        spaTaxAgeThreshold:
          type: integer
        adultAgeThreshold:
          type: integer
        averageAdultPrice:
          type: boolean
          description: >-
            Bei true enthaelt priceBreakdowns statt ADULT_DOUBLE und ADULT_MULTI den
            zusammengefassten Schluessel ADULT. pricesPerCategory fuehrt weiterhin
            beide Zimmerkategorien, dann mit demselben Preis.
        startDate:
          type: string
          format: date

    PriceBreakdown:
      type: object
      properties:
        basePricePerPerson:
          type: number
          format: float
        spaTaxPerPerson:
          type: number
          format: float
        groupExpenseShare:
          type: number
          format: float
        subtotalBeforeMarkup:
          type: number
          format: float
        markupPercent:
          type: number
          format: float
        markupAmount:
          type: number
          format: float
        subtotalBeforeClubFee:
          type: number
          format: float
        clubFeePercent:
          type: number
          format: float
        clubFeeAmount:
          type: number
          format: float
        finalPrice:
          type: number
          format: float
        count:
          type: integer
        categoryRevenue:
          type: number
          format: float
        averagedFrom:
          type: array
          description: >-
            Nur beim Schluessel ADULT und nur, wenn mehr als eine Zimmerkategorie
            beigetragen hat: die Posten, aus denen basePricePerPerson gemittelt
            wurde. Erlaubt der Oberflaeche, den Durchschnitt herzuleiten.
          items:
            type: object
            required: [categoryType, count, basePricePerPerson, total]
            properties:
              categoryType:
                type: string
                enum: [ADULT_DOUBLE, ADULT_MULTI]
              count:
                type: integer
              basePricePerPerson:
                type: number
                format: float
              total:
                type: number
                format: float
                description: count multipliziert mit basePricePerPerson.

    RegistrationParticipant:
      type: object
      required: [name, birthDate]
      properties:
        id:
          type: integer
          nullable: true
          readOnly: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
          readOnly: true
        name:
          type: string
        birthDate:
          type: string
          format: date

    BillingLineItem:
      type: object
      required: [participantName, categoryType, price]
      properties:
        participantName:
          type: string
        categoryType:
          type: string
          enum: [ADULT_DOUBLE, ADULT_MULTI, ADULT, CHILD, SPA_TAX, SPA_TAX_CREDIT]
        price:
          type: number
          format: float

    RegistrationWithBilling:
      type: object
      required: [id, tripId, roomCategory, participants, source]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        roomCategory:
          type: string
          nullable: true
        receivedAt:
          type: string
          nullable: true
        comment:
          type: string
        source:
          type: string
          enum: [csv, manual]
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationParticipant'
        billingCalculatedAt:
          type: string
          nullable: true
        billingTotal:
          type: number
          format: float
          nullable: true
        billingItems:
          type: array
          items:
            $ref: '#/components/schemas/BillingLineItem'

    CreateRegistrationRequest:
      type: object
      required: [participants]
      properties:
        roomCategory:
          type: string
          nullable: true
          example: "3-Bettzimmer"
        comment:
          type: string
          example: ""
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationParticipant'

    CreateActualExpenseRequest:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
          example: Unterkunft
        amount:
          type: number
          format: float
          example: 1500.00

    ActualExpense:
      type: object
      required: [id, tripId, label, amount]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        label:
          type: string
        amount:
          type: number
          format: float

    SettlementResponse:
      type: object
      required: [participantCount, registrationCount, totalRevenue, plannedCostItems, totalPlannedCosts, totalAdditionalExpenses, totalAllExpenses, surplus, expenses]
      properties:
        participantCount:
          type: integer
          minimum: 0
        registrationCount:
          type: integer
          minimum: 0
        totalRevenue:
          type: number
          format: float
        plannedCostItems:
          type: array
          items:
            $ref: '#/components/schemas/PlannedCostItem'
        totalPlannedCosts:
          type: number
          format: float
        totalAdditionalExpenses:
          type: number
          format: float
        totalAllExpenses:
          type: number
