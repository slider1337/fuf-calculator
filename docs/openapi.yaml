              $ref: '#/components/schemas/RegistrationModeRequest'
components:
  securitySchemes:
    memberDelegation:
      type: apiKey
      in: header
      name: Authorization
      description: FuF base64url(JSON claims).HMAC-SHA256; signed method/target/bodyHash, issuer/audience, memberId, iat/exp <=120s and single-use nonce. See docs/integration/member-api.md. Independent of calculatorSession.
    calculatorSession:
      type: apiKey
      in: cookie
      name: fufsid
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: validation_error
              details:
                type: object
                additionalProperties:
                  type: string
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: not_found
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: unauthorized
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorBody'
    AuthError:
      description: Authentication or authorization error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorBody'

  schemas:
    EventInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        archived:
          type: boolean
        revision:
          type: integer
          minimum: 1
      required:
      - name
    EventListItem:
      allOf:
      - $ref: '#/components/schemas/EventInput'
      - type: object
        properties:
          id:
            type: integer
            minimum: 1
          tripCount:
            type: integer
          nextTripDate:
            type: string
            format: date
            nullable: true
          capabilities:
            type: array
            items:
              type: string
        required:
        - id
        - tripCount
        - nextTripDate
        - capabilities
    EventDetail:
      allOf:
      - $ref: '#/components/schemas/EventInput'
      - type: object
        properties:
          id:
            type: integer
            minimum: 1
          trips:
            type: array
            items:
              $ref: '#/components/schemas/TripListItem'
          capabilities:
            type: array
            items:
              type: string
        required:
        - id
        - trips
        - capabilities
    TeamMember:
      type: object
      properties:
        userId:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        capabilities:
          type: array
          items:
            type: string
      required:
      - userId
      - email
      - capabilities
    GrantInput:
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
            enum:
            - trip.view
            - trip.manage
            - registration.view
            - registration.manage
            - answers.view
            - answers.correct
            - answers.export
            - analytics.view
            - calculation.manage
            - settlement.view
            - settlement.close
            - settlement.reopen
            - expense.view
            - expense.manage
            - term.manage
            - access.manage
            - event.view
            - event.manage
            - form.manage
            - form.publish
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - capabilities
      - reason
    ReasonInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    EventAssignment:
      type: object
      properties:
        eventId:
          type: integer
          nullable: true
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - eventId
      - reason
    DuplicateInput:
      type: object
      properties:
        name:
          type: string
