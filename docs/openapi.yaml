        - defaultSpaTaxAgeThreshold
        - defaultAdultAgeThreshold
      properties:
        defaultMarkupPercent:
          type: number
          format: float
          example: 10.0
        defaultClubFeePercent:
          type: number
          format: float
          example: 5.0
        defaultDistributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        defaultSpaTaxPerPerson:
          type: number
          format: float
          example: 2.5
        defaultSpaTaxAgeThreshold:
          type: integer
          example: 18
        defaultAdultAgeThreshold:
          type: integer
          example: 16

    RoomBooking:
      type: object
      required: [categoryType, count, basePricePerPerson]
      properties:
        categoryType:
          type: string
          enum: [ADULT_DOUBLE, ADULT_MULTI, CHILD]
        count:
          type: integer
        basePricePerPerson:
          type: number
          format: float

    GroupExpense:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
        amount:
          type: number
          format: float

    RoomReservation:
      type: object
      required: [roomType, count]
      properties:
        roomType:
          type: string
          example: 2-Bettzimmer
          description: >-
            Freier Text. Er wird den Zimmerkategorien der Anmeldungen zugeordnet, ohne
            Gross-/Kleinschreibung und Leerzeichen am Rand zu beachten.
        count:
          type: integer
          minimum: 0
          description: Anzahl reservierter Zimmer (nicht Personen).

    CreateTripRequest:
      type: object
      required:
        - name
        - startDate
        - markupPercent
        - clubFeePercent
        - distributionMethod
        - spaTaxPerPerson
        - spaTaxAgeThreshold
        - adultAgeThreshold
        - bookings
        - groupExpenses
      properties:
        registrationMode:
          type: string
          enum: [clubdesk_csv, easyverein]
          default: clubdesk_csv
          description: Beim Anlegen wählbar; bei PUT nur unveränderten Wert mitsenden. Wechsel über registration-mode, nicht über die Planung.
        eventId:
          type: integer
          nullable: true
          minimum: 1
          description: Optionale Veranstaltung für neue Durchführungen. Ohne Angabe oder mit null wird eine unabhängige Reise angelegt; andernfalls ist eine positive ganzzahlige ID mit event.manage erforderlich.
        name:
          type: string
        startDate:
          type: string
          format: date
        markupPercent:
          type: number
          format: float
        clubFeePercent:
          type: number
          format: float
        distributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        spaTaxPerPerson:
          type: number
          format: float
        spaTaxAgeThreshold:
          type: integer
        adultAgeThreshold:
          type: integer
          example: 16
        averageAdultPrice:
          type: boolean
          default: false
          description: >-
            Ist die Option gesetzt, zahlen Erwachsene im Doppel- und im Mehrbettzimmer
            denselben Preis: den nach Personenzahl gewichteten Durchschnitt der
            Naechtigungspreise. Die ausgewiesenen Unterkunftskosten bleiben davon
            unberuehrt.
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/RoomBooking'
        groupExpenses:
          type: array
          items:
            $ref: '#/components/schemas/GroupExpense'
        roomReservations:
          type: array
          default: []
          description: >-
            Beim Haus reservierte Zimmer je Typ. Jeder Typ darf nur einmal vorkommen
            (sonst 422 mit duplicate_room_type). Eintraege ohne Typ und mit Anzahl 0
            werden uebergangen; ohne Typ, aber mit Anzahl, liefern sie 422 mit
            room_type_required. Beim Aktualisieren ersetzt die Liste die bisherige.
          items:
            $ref: '#/components/schemas/RoomReservation'

    Trip:
      allOf:
      - $ref: '#/components/schemas/CreateTripRequest'
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
      - $ref: '#/components/schemas/TripSummary'

    TripListItem:
      type: object
      required:
      - id
      - name
      - startDate
      - endDate
      - nights
      - plannedParticipants
      - registeredParticipants
      - surplus
      - surplusBasis
      properties:
        registrationMode:
          type: string
          enum: [clubdesk_csv, easyverein]
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        nights:
          type: integer
        plannedParticipants:
          type: integer
          description: Summe der geplanten Teilnehmer ueber alle Zimmerbuchungen.
          nullable: true
        registeredParticipants:
          type: integer
          description: Summe der Teilnehmer ueber alle Anmeldungen.
          nullable: true
        surplus:
          type: number
          format: float
          nullable: true
          description: Ueberschuss bzw. Defizit. null, wenn er fuer die Reise nicht bestimmbar
            ist.
        surplusBasis:
          type: string
          nullable: true
          enum:
          - calculation
          - settlement
          description: Grundlage des Ueberschusses. "settlement", sobald Anmeldungen vorliegen,
            sonst "calculation". null, wenn surplus null ist.
        eventId:
          type: integer
          nullable: true
        closedAt:
          type: string
          nullable: true

    CalculationResult:
      type: object
      properties:
        pricesPerCategory:
          type: object
          additionalProperties:
            type: number
            format: float
        priceBreakdowns:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PriceBreakdown'
        totalGroupExpenses:
          type: number
          format: float
        totalParticipants:
          type: integer
        totalCalculatedRevenue:
          type: number
          format: float
        totalCalculatedCosts:
          type: number
          format: float
        surplus:
          type: number
          format: float
        distributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        spaTaxAgeThreshold:
          type: integer
        adultAgeThreshold:
          type: integer
        averageAdultPrice:
          type: boolean
          description: >-
            Bei true enthaelt priceBreakdowns statt ADULT_DOUBLE und ADULT_MULTI den
            zusammengefassten Schluessel ADULT. pricesPerCategory fuehrt weiterhin
            beide Zimmerkategorien, dann mit demselben Preis.
        startDate:
          type: string
          format: date

    PriceBreakdown:
      type: object
      properties:
        basePricePerPerson:
          type: number
          format: float
        spaTaxPerPerson:
          type: number
          format: float
        groupExpenseShare:
          type: number
          format: float
        subtotalBeforeMarkup:
          type: number
          format: float
        markupPercent:
          type: number
          format: float
        markupAmount:
          type: number
          format: float
        subtotalBeforeClubFee:
          type: number
          format: float
        clubFeePercent:
          type: number
          format: float
        clubFeeAmount:
          type: number
          format: float
        finalPrice:
          type: number
          format: float
        count:
          type: integer
        categoryRevenue:
          type: number
          format: float
        averagedFrom:
          type: array
          description: >-
            Nur beim Schluessel ADULT und nur, wenn mehr als eine Zimmerkategorie
            beigetragen hat: die Posten, aus denen basePricePerPerson gemittelt
            wurde. Erlaubt der Oberflaeche, den Durchschnitt herzuleiten.
          items:
            type: object
            required: [categoryType, count, basePricePerPerson, total]
            properties:
              categoryType:
                type: string
                enum: [ADULT_DOUBLE, ADULT_MULTI]
              count:
                type: integer
              basePricePerPerson:
                type: number
                format: float
              total:
                type: number
                format: float
                description: count multipliziert mit basePricePerPerson.

