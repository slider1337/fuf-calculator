        name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id009
        name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - &id010
        name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - csv
          - revisions
          - print
          default: json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '401':
          description: Session missing
        '403':
          description: Required trip capability missing
        '404':
          description: Booking or trip inaccessible
        '409':
          description: Revision, form version, idempotency conflict or closed trip
        '422':
          description: Validation error
  /api/events/{id}/analytics:
    get:
      summary: Auswertung / Drilldown / Export mit identischen Filtern; Export zusätzlich answers.export
      parameters:
      - *id001
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id010
      - name: tripIds
        in: query
        schema:
          type: string
        description: Explicit comma-separated event trip IDs; empty string selects no trips. Every selected trip must be authorized; default only allowed trips.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
        '401':
          description: Session missing
        '403':
          description: Required trip capability missing
        '404':
          description: Booking or trip inaccessible
        '409':
          description: Revision, form version, idempotency conflict or closed trip
        '422':
          description: Validation error
  /api/trips/{id}/planning-transfer:
    get:
      summary: Latest transfer and computed stale state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningStatus'
        '401':
          description: Session required
        '403':
          description: Capability required
        '404':
          description: Trip unavailable
        '409':
          description: Closed, stale, idempotency, reference or operation conflict /
            provider contract blocked
        '422':
          description: Invalid fields / incomplete assignments
      parameters:
      - name: id
        in: path
        required: true
        schema: &id001
          type: integer
  /api/trips/{id}/planning-transfer/preview:
    post:
      summary: Read-only confirmed-person preview using existing price calculator
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningPreview'
        '401':
          description: Session required
        '403':
          description: Capability required
        '404':
          description: Trip unavailable
        '409':
          description: Closed, stale, idempotency, reference or operation conflict /
            provider contract blocked
        '422':
          description: Invalid fields / incomplete assignments
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningTransferRequest'
  /api/trips/{id}/planning-transfer/apply:
    post:
      summary: Explicit atomic transfer with source conflict detection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationSnapshot'
        '401':
          description: Session required
        '403':
          description: Capability required
        '404':
          description: Trip unavailable
        '409':
          description: Closed, stale, idempotency, reference or operation conflict /
            provider contract blocked
        '422':
          description: Invalid fields / incomplete assignments
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningApplyRequest'
  /api/trips/{id}/term:
    get:
      summary: Local draft, durable operation, verified reference and registration gate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermState'
        '401':
