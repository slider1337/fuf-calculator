      description: Benötigt term.manage. Schreibaktionen sind bei Archiv/Abschluss gesperrt. Frischer Stand und reviewHash;
        nur ausgewählte Felder. Worker prüft vor einem PATCH erneut. Nach Timeout/Leaseablauf ausschließlich GET-Abgleich;
