openapi: 3.0.3
info:
  title: FUF Gruppenreise Kalkulator API
  version: 1.1.0
security:
  - calculatorSession: []
servers:
  - url: /
paths:
  /api/settings:
    get:
      summary: Globale Defaults laden
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
    put:
      summary: Globale Defaults aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips:
    get:
      summary: Ausschließlich freigegebene Reisen als Liste
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripListItem'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
    post:
      summary: Reise anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}:
    get:
      summary: Reise laden
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Trip'
                - $ref: '#/components/schemas/TripSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
      description: trip.view erforderlich. Ohne calculation.manage oder settlement.view nur Stammdaten und Freigaben,
        keine Finanzwerte.
    put:
      summary: Reise aktualisieren
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/calculate:
    post:
      summary: Reisepreise berechnen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/registrations:
    get:
      summary: Anmeldungen einer Reise laden
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
    post:
      summary: Anmeldung manuell hinzufuegen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
    delete:
      summary: Alle Anmeldungen einer Reise loeschen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/registrations/{registrationId}:
    delete:
      summary: Einzelne Anmeldung loeschen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: registrationId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/registrations/import:
    post:
      summary: CSV-Datei mit Anmeldungen importieren
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - csv_file
              properties:
                csv_file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/registrations/recalculate:
    post:
      summary: Abrechnungen aller Anmeldungen neu berechnen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/actual-expenses:
    get:
      summary: Tatsaechliche Ausgaben einer Reise laden
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActualExpense'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
    post:
      summary: Tatsaechliche Ausgabe hinzufuegen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActualExpenseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualExpense'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/actual-expenses/{expenseId}:
    put:
      summary: Tatsaechliche Ausgabe aktualisieren
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActualExpenseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualExpense'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
    delete:
      summary: Tatsaechliche Ausgabe loeschen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/settlement:
    get:
      summary: Abrechnung / Settlement einer Reise
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
  /api/auth/me:
    get:
      summary: Aktuell angemeldeten Benutzer laden
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
  /api/auth/invite:
    post:
      summary: Einladung an eine E-Mail-Adresse senden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/AuthError'
        '500':
          description: Mailer-Fehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/users:
    get:
      summary: Alle Benutzer auflisten
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
  /api/users/{id}:
    delete:
      summary: Benutzer loeschen (nur Admin)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Aktion nicht erlaubt (z. B. Selbst-Loeschung oder letzter Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '409':
          description: Abgerechnete Reise gesperrt
  /api/events:
    get:
      summary: Erlaubte Veranstaltungen suchen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventListItem'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: archived
        in: query
        schema:
          type: boolean
          default: false
    post:
      summary: Veranstaltung anlegen
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/events/{id}:
    get:
      summary: Veranstaltung und ausschließlich erlaubte Reisen lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
    put:
      summary: Stammdaten ändern, archivieren oder reaktivieren
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      description: revision muss dem aktuellen Stand entsprechen. Archivierung erhält historische Reisen und sperrt
        neue Anlage.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/access:
    get:
      summary: Veranstaltungsrechte lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: access.manage am Ziel oder globaler Admin erforderlich.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/access/{userId}:
    put:
      summary: Veranstaltungsrechte vergeben oder widerrufen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      description: Leere capabilities widerruft. Kein impliziter fachlicher Zugriff für Admins. Nicht-Admins dürfen
        keine über eigenen Freigaben hinausgehenden Reiserechte delegieren. Die Veranstaltungsvorlage ist eine unabhängige
        Kopiervorlage.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/default-team:
    get:
      summary: Unabhängiges Standardteam lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: access.manage am Ziel oder globaler Admin erforderlich.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/default-team/{userId}:
    put:
      summary: Unabhängiges Standardteam vergeben oder widerrufen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      description: Leere capabilities widerruft. Kein impliziter fachlicher Zugriff für Admins. Nicht-Admins dürfen
        keine über eigenen Freigaben hinausgehenden Reiserechte delegieren. Die Veranstaltungsvorlage ist eine unabhängige
        Kopiervorlage.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/team:
    get:
      summary: Reiseteam lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: access.manage am Ziel oder globaler Admin erforderlich.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/team/{userId}:
    put:
      summary: Reiseteam vergeben oder widerrufen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      description: Leere capabilities widerruft. Kein impliziter fachlicher Zugriff für Admins. Nicht-Admins dürfen
        keine über eigenen Freigaben hinausgehenden Reiserechte delegieren. Die Veranstaltungsvorlage ist eine unabhängige
        Kopiervorlage.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/people:
    get:
      summary: Wählbare Kontoidentitäten für Teamverwaltung
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamPerson'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: access.manage am Ziel oder globaler Admin. Nur ID/E-Mail, keine Rolle, Passwörter oder Token.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/people:
    get:
      summary: Wählbare Kontoidentitäten für Teamverwaltung
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamPerson'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: access.manage am Ziel oder globaler Admin. Nur ID/E-Mail, keine Rolle, Passwörter oder Token.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/event:
    put:
      summary: Reise gezielt zuordnen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAssignment'
      description: trip.manage sowie event.manage der alten und neuen Veranstaltung. Abgerechnete Reise gesperrt.
        Keine Änderung von Teilnehmern, Planung oder Reiserechten.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/close:
    post:
      summary: Abrechnung einfrieren
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      description: settlement.close, trip.view und settlement.view erforderlich. Finanzstände werden gespeichert.
        Alle Finanzschreibwege und calculate sind anschließend gesperrt.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/reopen:
    post:
      summary: Abrechnung begründet wiederöffnen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      description: Separate Ausnahmeaktion mit settlement.reopen, Grund und Audit.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/duplicate:
    post:
      summary: Planung als neue Reise kopieren
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 1
                required:
                - id
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateInput'
      description: trip.manage und calculation.manage am Original, event.manage der Veranstaltung. Kopiert Planungsdaten und aktuelle Standardteamvorlage,
        niemals Teilnehmer, Antworten, Ist-Ausgaben, externe Referenzen oder Abschluss.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/admin/legacy-access:
    get:
      summary: Alt-Rechteübernahme vorschauen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegacyCandidate'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: Nur globaler Admin. Kandidaten sind der Benutzer-/Reisebestand zum Migrationszeitpunkt, noch
        keine Freigabe.
    post:
      summary: Explizit ausgewählte Alt-Zuordnungen protokolliert übernehmen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyAccessInput'
      description: Nur Zuordnungen aus der Vorschau. Neue Benutzer erben keine Altfreigaben. Ohne capabilities wird
        der bisherige funktionale Umfang konkret je Reise übernommen.

components:
  securitySchemes:
    calculatorSession:
      type: apiKey
      in: cookie
      name: fufsid
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: validation_error
              details:
                type: object
                additionalProperties:
                  type: string
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: not_found
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: unauthorized
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorBody'
    AuthError:
      description: Authentication or authorization error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorBody'

  schemas:
    EventInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        archived:
          type: boolean
        revision:
          type: integer
          minimum: 1
      required:
      - name
    EventListItem:
      allOf:
      - $ref: '#/components/schemas/EventInput'
      - type: object
        properties:
          id:
            type: integer
            minimum: 1
          tripCount:
            type: integer
          nextTripDate:
            type: string
            format: date
            nullable: true
          capabilities:
            type: array
            items:
              type: string
        required:
        - id
        - tripCount
        - nextTripDate
        - capabilities
    EventDetail:
      allOf:
      - $ref: '#/components/schemas/EventInput'
      - type: object
        properties:
          id:
            type: integer
            minimum: 1
          trips:
            type: array
            items:
              $ref: '#/components/schemas/TripListItem'
          capabilities:
            type: array
            items:
              type: string
        required:
        - id
        - trips
        - capabilities
    TeamMember:
      type: object
      properties:
        userId:
          type: integer
          minimum: 1
        email:
          type: string
          format: email
        capabilities:
          type: array
          items:
            type: string
      required:
      - userId
      - email
      - capabilities
    GrantInput:
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
            enum:
            - trip.view
            - trip.manage
            - registration.view
            - registration.manage
            - answers.view
            - answers.correct
            - answers.export
            - analytics.view
            - calculation.manage
            - settlement.view
            - settlement.close
            - settlement.reopen
            - expense.view
            - expense.manage
            - term.manage
            - access.manage
            - event.view
            - event.manage
            - form.manage
            - form.publish
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - capabilities
      - reason
    ReasonInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    EventAssignment:
      type: object
      properties:
        eventId:
          type: integer
          nullable: true
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - eventId
      - reason
    DuplicateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
      required:
      - name
      - startDate
    LegacyCandidate:
      type: object
      properties:
        tripId:
          type: integer
          minimum: 1
        tripName:
          type: string
        userId:
          type: integer
          minimum: 1
        email:
          type: string
      required:
      - tripId
      - tripName
      - userId
      - email
    LegacyAccessInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        pairs:
          type: array
          items:
            type: object
            properties:
              tripId:
                type: integer
                minimum: 1
              userId:
                type: integer
                minimum: 1
              capabilities:
                type: array
                items:
                  type: string
            required:
            - tripId
            - userId
      required:
      - reason
      - pairs
    TeamPerson:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        email:
          type: string
      required:
      - id
      - email
    ActionResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    TripSummary:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        eventId:
          type: integer
          nullable: true
        closedAt:
          type: string
          nullable: true
        closedBy:
          type: integer
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        calculationSnapshot:
          allOf:
          - $ref: '#/components/schemas/CalculationResult'
          nullable: true
      required:
      - id
      - name
      - startDate
      - endDate
      - eventId
      - closedAt
      - closedBy
      - capabilities
      - calculationSnapshot
    Settings:
      type: object
      required:
        - defaultMarkupPercent
        - defaultClubFeePercent
        - defaultDistributionMethod
        - defaultSpaTaxPerPerson
        - defaultSpaTaxAgeThreshold
        - defaultAdultAgeThreshold
      properties:
        defaultMarkupPercent:
          type: number
          format: float
          example: 10.0
        defaultClubFeePercent:
          type: number
          format: float
          example: 5.0
        defaultDistributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        defaultSpaTaxPerPerson:
          type: number
          format: float
          example: 2.5
        defaultSpaTaxAgeThreshold:
          type: integer
          example: 18
        defaultAdultAgeThreshold:
          type: integer
          example: 16

    RoomBooking:
      type: object
      required: [categoryType, count, basePricePerPerson]
      properties:
        categoryType:
          type: string
          enum: [ADULT_DOUBLE, ADULT_MULTI, CHILD]
        count:
          type: integer
        basePricePerPerson:
          type: number
          format: float

    GroupExpense:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
        amount:
          type: number
          format: float

    RoomReservation:
      type: object
      required: [roomType, count]
      properties:
        roomType:
          type: string
          example: 2-Bettzimmer
          description: >-
            Freier Text. Er wird den Zimmerkategorien der Anmeldungen zugeordnet, ohne
            Gross-/Kleinschreibung und Leerzeichen am Rand zu beachten.
        count:
          type: integer
          minimum: 0
          description: Anzahl reservierter Zimmer (nicht Personen).

    CreateTripRequest:
      type: object
      required:
        - name
        - startDate
        - markupPercent
        - clubFeePercent
        - distributionMethod
        - spaTaxPerPerson
        - spaTaxAgeThreshold
        - adultAgeThreshold
        - bookings
        - groupExpenses
      properties:
        eventId:
          type: integer
          nullable: true
          minimum: 1
          description: Veranstaltung für neue Durchführungen; ohne Angabe bleibt der bestehende API-Anlageweg kompatibel.
        name:
          type: string
        startDate:
          type: string
          format: date
        markupPercent:
          type: number
          format: float
        clubFeePercent:
          type: number
          format: float
        distributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        spaTaxPerPerson:
          type: number
          format: float
        spaTaxAgeThreshold:
          type: integer
        adultAgeThreshold:
          type: integer
          example: 16
        averageAdultPrice:
          type: boolean
          default: false
          description: >-
            Ist die Option gesetzt, zahlen Erwachsene im Doppel- und im Mehrbettzimmer
            denselben Preis: den nach Personenzahl gewichteten Durchschnitt der
            Naechtigungspreise. Die ausgewiesenen Unterkunftskosten bleiben davon
            unberuehrt.
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/RoomBooking'
        groupExpenses:
          type: array
          items:
            $ref: '#/components/schemas/GroupExpense'
        roomReservations:
          type: array
          default: []
          description: >-
            Beim Haus reservierte Zimmer je Typ. Jeder Typ darf nur einmal vorkommen
            (sonst 422 mit duplicate_room_type). Eintraege ohne Typ und mit Anzahl 0
            werden uebergangen; ohne Typ, aber mit Anzahl, liefern sie 422 mit
            room_type_required. Beim Aktualisieren ersetzt die Liste die bisherige.
          items:
            $ref: '#/components/schemas/RoomReservation'

    Trip:
      allOf:
      - $ref: '#/components/schemas/CreateTripRequest'
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
      - $ref: '#/components/schemas/TripSummary'

    TripListItem:
      type: object
      required:
      - id
      - name
      - startDate
      - endDate
      - nights
      - plannedParticipants
      - registeredParticipants
      - surplus
      - surplusBasis
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        nights:
          type: integer
        plannedParticipants:
          type: integer
          description: Summe der geplanten Teilnehmer ueber alle Zimmerbuchungen.
          nullable: true
        registeredParticipants:
          type: integer
          description: Summe der Teilnehmer ueber alle Anmeldungen.
          nullable: true
        surplus:
          type: number
          format: float
          nullable: true
          description: Ueberschuss bzw. Defizit. null, wenn er fuer die Reise nicht bestimmbar
            ist.
        surplusBasis:
          type: string
          nullable: true
          enum:
          - calculation
          - settlement
          description: Grundlage des Ueberschusses. "settlement", sobald Anmeldungen vorliegen,
            sonst "calculation". null, wenn surplus null ist.
        eventId:
          type: integer
          nullable: true
        closedAt:
          type: string
          nullable: true

    CalculationResult:
      type: object
      properties:
        pricesPerCategory:
          type: object
          additionalProperties:
            type: number
            format: float
        priceBreakdowns:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PriceBreakdown'
        totalGroupExpenses:
          type: number
          format: float
        totalParticipants:
          type: integer
        totalCalculatedRevenue:
          type: number
          format: float
        totalCalculatedCosts:
          type: number
          format: float
        surplus:
          type: number
          format: float
        distributionMethod:
          type: string
          enum: [PER_PERSON, PER_CATEGORY_UNITS]
        spaTaxAgeThreshold:
          type: integer
        adultAgeThreshold:
          type: integer
        averageAdultPrice:
          type: boolean
          description: >-
            Bei true enthaelt priceBreakdowns statt ADULT_DOUBLE und ADULT_MULTI den
            zusammengefassten Schluessel ADULT. pricesPerCategory fuehrt weiterhin
            beide Zimmerkategorien, dann mit demselben Preis.
        startDate:
          type: string
          format: date

    PriceBreakdown:
      type: object
      properties:
        basePricePerPerson:
          type: number
          format: float
        spaTaxPerPerson:
          type: number
          format: float
        groupExpenseShare:
          type: number
          format: float
        subtotalBeforeMarkup:
          type: number
          format: float
        markupPercent:
          type: number
          format: float
        markupAmount:
          type: number
          format: float
        subtotalBeforeClubFee:
          type: number
          format: float
        clubFeePercent:
          type: number
          format: float
        clubFeeAmount:
          type: number
          format: float
        finalPrice:
          type: number
          format: float
        count:
          type: integer
        categoryRevenue:
          type: number
          format: float
        averagedFrom:
          type: array
          description: >-
            Nur beim Schluessel ADULT und nur, wenn mehr als eine Zimmerkategorie
            beigetragen hat: die Posten, aus denen basePricePerPerson gemittelt
            wurde. Erlaubt der Oberflaeche, den Durchschnitt herzuleiten.
          items:
            type: object
            required: [categoryType, count, basePricePerPerson, total]
            properties:
              categoryType:
                type: string
                enum: [ADULT_DOUBLE, ADULT_MULTI]
              count:
                type: integer
              basePricePerPerson:
                type: number
                format: float
              total:
                type: number
                format: float
                description: count multipliziert mit basePricePerPerson.

    RegistrationParticipant:
      type: object
      required: [name, birthDate]
      properties:
        name:
          type: string
        birthDate:
          type: string
          format: date

    BillingLineItem:
      type: object
      required: [participantName, categoryType, price]
      properties:
        participantName:
          type: string
        categoryType:
          type: string
          enum: [ADULT_DOUBLE, ADULT_MULTI, CHILD, SPA_TAX, SPA_TAX_CREDIT]
        price:
          type: number
          format: float

    RegistrationWithBilling:
      type: object
      required: [id, tripId, roomCategory, participants, source]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        roomCategory:
          type: string
        receivedAt:
          type: string
          nullable: true
        comment:
          type: string
        source:
          type: string
          enum: [csv, manual]
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationParticipant'
        billingCalculatedAt:
          type: string
          nullable: true
        billingTotal:
          type: number
          format: float
          nullable: true
        billingItems:
          type: array
          items:
            $ref: '#/components/schemas/BillingLineItem'

    CreateRegistrationRequest:
      type: object
      required: [roomCategory, participants]
      properties:
        roomCategory:
          type: string
          example: "3-Bettzimmer"
        comment:
          type: string
          example: ""
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationParticipant'

    CreateActualExpenseRequest:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
          example: Unterkunft
        amount:
          type: number
          format: float
          example: 1500.00

    ActualExpense:
      type: object
      required: [id, tripId, label, amount]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        label:
          type: string
        amount:
          type: number
          format: float

    SettlementResponse:
      type: object
      required: [participantCount, registrationCount, totalRevenue, plannedCostItems, totalPlannedCosts, totalAdditionalExpenses, totalAllExpenses, surplus, expenses]
      properties:
        participantCount:
          type: integer
          minimum: 0
        registrationCount:
          type: integer
          minimum: 0
        totalRevenue:
          type: number
          format: float
        plannedCostItems:
          type: array
          items:
            $ref: '#/components/schemas/PlannedCostItem'
        totalPlannedCosts:
          type: number
          format: float
        totalAdditionalExpenses:
          type: number
          format: float
        totalAllExpenses:
          type: number
          format: float
        surplus:
          type: number
          format: float
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/ActualExpense'

    PlannedCostItem:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
          example: "Zimmer: Erwachsener DZ (3 × 100.00 €)"
        amount:
          type: number
          format: float

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    AuthErrorBody:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: forbidden
        message:
          type: string

    CurrentUser:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          nullable: true
        role:
          type: string
          enum: [admin, user]
          nullable: true

    InviteRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    UserSummary:
      type: object
      required: [id, email, role, createdAt, isCurrentUser, hasPassword, canDelete]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        createdAt:
          type: string
          format: date-time
        isCurrentUser:
          type: boolean
        hasPassword:
          type: boolean
        canDelete:
          type: boolean

    UserListResponse:
      type: object
      required: [users]
      properties:
        users:
