openapi: 3.0.3
info:
  title: FUF Gruppenreise Kalkulator API
  version: 1.4.0
security:
  - calculatorSession: []
servers:
  - url: /
paths:
  /api/settings:
    get:
      summary: Globale Defaults laden
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
    put:
      summary: Globale Defaults aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips:
    get:
      summary: Ausschließlich freigegebene Reisen als Liste
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripListItem'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
    post:
      summary: Reise anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}:
    get:
      summary: Reise laden
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Trip'
                - $ref: '#/components/schemas/TripSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
      description: trip.view erforderlich. Ohne calculation.manage oder settlement.view nur Stammdaten und Freigaben,
        keine Finanzwerte.
    put:
      summary: Reise aktualisieren
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/calculate:
    post:
      summary: Reisepreise berechnen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/registrations:
    get:
      summary: Anmeldungen einer Reise laden
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
    post:
      summary: Anmeldung manuell hinzufuegen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
    delete:
      summary: Alle Anmeldungen einer Reise loeschen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/registrations/{registrationId}:
    delete:
      summary: Einzelne Anmeldung loeschen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: registrationId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/registrations/import:
    post:
      summary: CSV-Datei mit Anmeldungen importieren
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - csv_file
              properties:
                csv_file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/registrations/recalculate:
    post:
      summary: Abrechnungen aller Anmeldungen neu berechnen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationWithBilling'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/actual-expenses:
    get:
      summary: Tatsaechliche Ausgaben einer Reise laden
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActualExpense'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
    post:
      summary: Tatsaechliche Ausgabe hinzufuegen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActualExpenseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualExpense'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/actual-expenses/{expenseId}:
    put:
      summary: Tatsaechliche Ausgabe aktualisieren
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActualExpenseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualExpense'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
    delete:
      summary: Tatsaechliche Ausgabe loeschen
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: expenseId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/trips/{id}/settlement:
    get:
      summary: Abrechnung / Settlement einer Reise
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: Anmeldung fehlt
        '403':
          description: Fähigkeit fehlt
  /api/auth/me:
    get:
      summary: Aktuell angemeldeten Benutzer laden
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
  /api/auth/invite:
    post:
      summary: Einladung an eine E-Mail-Adresse senden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/AuthError'
        '500':
          description: Mailer-Fehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
        '409':
          description: Abgerechnete Reise gesperrt
  /api/users:
    get:
      summary: Alle Benutzer auflisten
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Reise nicht freigegeben oder Ressource fehlt
  /api/users/{id}:
    delete:
      summary: Benutzer loeschen (nur Admin)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Aktion nicht erlaubt (z. B. Selbst-Loeschung oder letzter Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
        '409':
          description: Abgerechnete Reise gesperrt
  /api/events:
    get:
      summary: Erlaubte Veranstaltungen suchen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventListItem'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: archived
        in: query
        schema:
          type: boolean
          default: false
    post:
      summary: Veranstaltung anlegen
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
  /api/events/{id}:
    get:
      summary: Veranstaltung und ausschließlich erlaubte Reisen lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
    put:
      summary: Stammdaten ändern, archivieren oder reaktivieren
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      description: revision muss dem aktuellen Stand entsprechen. Archivierung erhält historische Reisen und sperrt
        neue Anlage.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/access:
    get:
      summary: Veranstaltungsrechte lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: access.manage am Ziel oder globaler Admin erforderlich.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/access/{userId}:
    put:
      summary: Veranstaltungsrechte vergeben oder widerrufen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      description: Leere capabilities widerruft. Kein impliziter fachlicher Zugriff für Admins. Nicht-Admins dürfen
        keine über eigenen Freigaben hinausgehenden Reiserechte delegieren. Die Veranstaltungsvorlage ist eine unabhängige
        Kopiervorlage.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/default-team:
    get:
      summary: Unabhängiges Standardteam lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: access.manage am Ziel oder globaler Admin erforderlich.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/default-team/{userId}:
    put:
      summary: Unabhängiges Standardteam vergeben oder widerrufen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      description: Leere capabilities widerruft. Kein impliziter fachlicher Zugriff für Admins. Nicht-Admins dürfen
        keine über eigenen Freigaben hinausgehenden Reiserechte delegieren. Die Veranstaltungsvorlage ist eine unabhängige
        Kopiervorlage.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/team:
    get:
      summary: Reiseteam lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      description: access.manage am Ziel oder globaler Admin erforderlich.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/trips/{id}/team/{userId}:
    put:
      summary: Reiseteam vergeben oder widerrufen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      description: Leere capabilities widerruft. Kein impliziter fachlicher Zugriff für Admins. Nicht-Admins dürfen
        keine über eigenen Freigaben hinausgehenden Reiserechte delegieren. Die Veranstaltungsvorlage ist eine unabhängige
        Kopiervorlage.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /api/events/{id}/people:
    get:
      summary: Wählbare Kontoidentitäten für Teamverwaltung
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamPerson'
        '401':
          description: Anmeldung fehlt oder Konto gelöscht
        '403':
          description: Fähigkeit fehlt
        '404':
          description: Ressource fehlt oder Reise nicht freigegeben
        '409':
          description: Abgerechnet, archiviert oder Revisionskonflikt
        '422':
          description: Ungültige Eingaben
